
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>একতা ক্লাব সদস্যবৃন্দ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { 
      font-family: 'Plus Jakarta Sans', 'Hind Siliguri', sans-serif; 
      background: radial-gradient(circle at top left, #f0fdf4, #f8fafc 50%, #e2e8f0 100%);
      background-attachment: fixed;
      color: #1e293b;
    }
    .light-glass-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 10px 30px -5px rgba(15, 23, 42, 0.05), 0 4px 10px -2px rgba(15, 23, 42, 0.03);
    }
    .light-input {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      color: #0f172a;
      transition: all 0.2s ease;
    }
    .light-input:focus {
      border-color: #059669;
      box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.15);
      outline: none;
    }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
  </style>
</head>
<body class="min-h-screen p-3 sm:p-5 flex flex-col items-center pb-24 selection:bg-emerald-500 selection:text-white">
  <div class="w-full max-w-xl">
    <!-- Header -->
    <header class="flex justify-between items-center py-3.5 px-1 mb-2">
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-emerald-600 to-teal-600 flex items-center justify-center text-xl text-white shadow-lg shadow-emerald-600/25">
          👥
        </div>
        <div>
          <h1 class="text-lg font-extrabold tracking-tight text-slate-800 flex items-center gap-2">
            একতা ক্লাব
            <span class="text-[10px] uppercase font-bold tracking-wider bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full border border-emerald-200">সদস্যবৃন্দ</span>
          </h1>
          <p class="text-[11px] text-slate-500 font-medium">নাম, পদবি ও মোবাইল ডিরেক্টরি</p>
        </div>
      </div>
      
      <button id="loginBtn" class="bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-white px-4 py-2 rounded-xl text-xs font-semibold shadow-md shadow-emerald-600/20 transition">লগইন</button>
      
      <div id="userSection" class="hidden flex items-center gap-2 bg-white/90 border border-slate-200 py-1.5 px-3 rounded-2xl shadow-sm">
        <span id="userName" class="text-xs text-slate-700 font-semibold max-w-[100px] truncate"></span>
        <button id="logoutBtn" class="bg-rose-50 hover:bg-rose-100 text-rose-600 p-1.5 rounded-xl transition" title="লগআউট">
          <i class="fa-solid fa-arrow-right-from-bracket text-xs"></i>
        </button>
      </div>
    </header>

    <!-- App Content Area -->
    <main id="appContent" class="hidden space-y-4">
      <!-- Summary Card -->
      <div class="light-glass-card p-3 rounded-2xl flex justify-between items-center px-5">
        <div>
          <p class="text-[11px] text-slate-500 font-medium">মোট সদস্যবৃন্দ</p>
          <h3 id="statTotalMembers" class="text-xl font-extrabold text-emerald-700">০ জন</h3>
        </div>
        <button type="button" id="toggleFormBtn" class="bg-emerald-100 hover:bg-emerald-200 text-emerald-800 border border-emerald-300 px-3.5 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5">
          <i class="fa-solid fa-user-plus"></i> <span id="toggleFormText">নতুন সদস্য যোগ</span>
        </button>
      </div>

      <!-- Add/Edit Member Form -->
      <form id="memberForm" class="light-glass-card p-4 rounded-3xl shadow-xl space-y-3 hidden">
        <div class="flex justify-between items-center border-b border-slate-200 pb-2">
          <h2 class="text-xs font-bold uppercase tracking-wider text-emerald-800 flex items-center gap-1.5">
            <i class="fa-solid fa-id-card text-emerald-600"></i> <span id="formTitle">সদস্যের তথ্য ফরম</span>
          </h2>
          <button type="button" id="cancelEditBtn" class="text-xs text-slate-500 hover:text-slate-800 font-medium">বাতিল</button>
        </div>

        <input type="hidden" id="editMemberId" value="">

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
          <div>
            <label class="text-[11px] text-slate-500 font-medium ml-1">পূর্ণ নাম *</label>
            <input type="text" id="memberName" placeholder="যেমন: মো: করিম" required class="w-full light-input px-3 py-2 rounded-xl text-xs mt-0.5">
          </div>
          <div>
            <label class="text-[11px] text-slate-500 font-medium ml-1">পদবি / ভূমিকা *</label>
            <select id="memberRole" required class="w-full light-input px-3 py-2 rounded-xl text-xs mt-0.5 font-medium cursor-pointer">
              <option value="সাধারণ সদস্য">সাধারণ সদস্য</option>
              <option value="সভাপতি">সভাপতি</option>
              <option value="সহ-সভাপতি">সহ-সভাপতি</option>
              <option value="সাধারণ সম্পাদক">সাধারণ সম্পাদক</option>
              <option value="যুগ্ম সাধারণ সম্পাদক">যুগ্ম সাধারণ সম্পাদক</option>
              <option value="কোষাধ্যক্ষ / ক্যাশিয়ার">কোষাধ্যক্ষ / ক্যাশিয়ার</option>
              <option value="সাংগঠনিক সম্পাদক">সাংগঠনিক সম্পাদক</option>
              <option value="দপ্তর সম্পাদক">দপ্তর সম্পাদক</option>
              <option value="প্রচার সম্পাদক">প্রচার সম্পাদক</option>
              <option value="ক্রীড়া সম্পাদক">ক্রীড়া সম্পাদক</option>
              <option value="উপদেষ্টা">উপদেষ্টা</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
          <div>
            <label class="text-[11px] text-slate-500 font-medium ml-1">মোবাইল নম্বর *</label>
            <input type="tel" id="memberPhone" placeholder="017xxxxxxxx" required class="w-full light-input px-3 py-2 rounded-xl text-xs mt-0.5">
          </div>
          <div>
            <label class="text-[11px] text-slate-500 font-medium ml-1">রক্তের গ্রুপ (ঐচ্ছিক)</label>
            <select id="memberBlood" class="w-full light-input px-3 py-2 rounded-xl text-xs mt-0.5 cursor-pointer font-medium">
              <option value="">জানা নেই / খালি রাখুন</option>
              <option value="A+">A+</option>
              <option value="A-">A-</option>
              <option value="B+">B+</option>
              <option value="B-">B-</option>
              <option value="AB+">AB+</option>
              <option value="AB-">AB-</option>
              <option value="O+">O+</option>
              <option value="O-">O-</option>
            </select>
          </div>
        </div>

        <div>
          <label class="text-[11px] text-slate-500 font-medium ml-1">বর্তমান ঠিকানা / গ্রাম</label>
          <input type="text" id="memberAddress" placeholder="গ্রাম/ওয়ার্ড, উপজেলা, জেলা" class="w-full light-input px-3.5 py-2 rounded-xl text-xs mt-0.5">
        </div>

        <div class="flex justify-end pt-1">
          <button type="submit" id="submitBtn" class="bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-white px-5 py-2.5 rounded-xl text-xs font-bold shadow-md shadow-emerald-600/20 transition flex items-center gap-1.5 active:scale-95">
            <i class="fa-solid fa-floppy-disk"></i> <span id="submitBtnText">সংরক্ষণ করুন</span>
          </button>
        </div>
      </form>

      <!-- Search & Filter Row -->
      <div class="flex gap-2 pt-1">
        <div class="relative flex-1">
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-slate-400 text-xs"></i>
          <input type="text" id="searchInput" placeholder="নাম, ফোন, পদবি বা ঠিকানা দিয়ে খুঁজুন..." class="w-full light-input pl-9 pr-3 py-2.5 rounded-2xl text-xs placeholder:text-slate-400 shadow-sm">
        </div>
        
        <select id="roleFilter" class="light-input rounded-2xl px-3 text-xs text-slate-700 font-medium cursor-pointer shadow-sm">
          <option value="all">সব পদবি</option>
          <option value="সভাপতি">সভাপতি</option>
          <option value="সাধারণ সম্পাদক">সাধারণ সম্পাদক</option>
          <option value="কোষাধ্যক্ষ / ক্যাশিয়ার">কোষাধ্যক্ষ</option>
          <option value="সাংগঠনিক সম্পাদক">সাংগঠনিক সম্পাদক</option>
          <option value="সাধারণ সদস্য">সাধারণ সদস্য</option>
        </select>
      </div>

      <!-- Members List -->
      <div id="membersList" class="space-y-3 pt-1">
        <p class="text-slate-400 text-center text-sm py-8 font-medium">লোড হচ্ছে...</p>
      </div>
    </main>

    <!-- Signed Out View -->
    <div id="loggedOutView" class="mt-20 text-center p-8 light-glass-card rounded-3xl shadow-xl border border-white">
      <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-emerald-500 to-teal-600 text-white flex items-center justify-center mx-auto text-3xl shadow-xl shadow-emerald-500/20 mb-4">
        👥
      </div>
      <h2 class="text-lg font-bold text-slate-800">একতা ক্লাব সদস্যবৃন্দ</h2>
      <p class="text-xs text-slate-500 mt-1 max-w-xs mx-auto">সকল সদস্যবৃন্দের তথ্য ক্লাউডে পরিচালনা ও দেখতে গুগল অ্যাকাউন্ট দিয়ে লগইন করুন।</p>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-6 bg-slate-900 text-white px-4 py-2.5 rounded-2xl text-xs font-medium shadow-2xl transition-all duration-300 transform translate-y-24 opacity-0 pointer-events-none flex items-center gap-2">
    <i class="fa-solid fa-circle-check text-emerald-400"></i>
    <span id="toastMsg">সফল হয়েছে!</span>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, updateDoc, query, where, onSnapshot, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCJXc8miGg_6bAZCb_SpYfGelwzxhA3bpw",
      authDomain: "apu-s-notes.firebaseapp.com",
      projectId: "apu-s-notes",
      storageBucket: "apu-s-notes.firebasestorage.app",
      messagingSenderId: "469045356302",
      appId: "1:469045356302:web:9db39c7df9564ca4c1995f",
      measurementId: "G-T6ELLRKVM4"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null;
    let allMembers = [];

    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const userSection = document.getElementById("userSection");
    const userName = document.getElementById("userName");
    const appContent = document.getElementById("appContent");
    const loggedOutView = document.getElementById("loggedOutView");

    const toggleFormBtn = document.getElementById("toggleFormBtn");
    const toggleFormText = document.getElementById("toggleFormText");
    const memberForm = document.getElementById("memberForm");
    const editMemberId = document.getElementById("editMemberId");
    const memberName = document.getElementById("memberName");
    const memberRole = document.getElementById("memberRole");
    const memberPhone = document.getElementById("memberPhone");
    const memberBlood = document.getElementById("memberBlood");
    const memberAddress = document.getElementById("memberAddress");
    const cancelEditBtn = document.getElementById("cancelEditBtn");
    const submitBtnText = document.getElementById("submitBtnText");
    const formTitle = document.getElementById("formTitle");

    const membersList = document.getElementById("membersList");
    const searchInput = document.getElementById("searchInput");
    const roleFilter = document.getElementById("roleFilter");
    const statTotalMembers = document.getElementById("statTotalMembers");
    const toast = document.getElementById("toast");
    const toastMsg = document.getElementById("toastMsg");

    loginBtn.onclick = () => signInWithPopup(auth, provider).catch(err => alert("Login Error: " + err.message));
    logoutBtn.onclick = () => signOut(auth);

    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      if (user) {
        userSection.classList.remove("hidden");
        loginBtn.classList.add("hidden");
        appContent.classList.remove("hidden");
        loggedOutView.classList.add("hidden");
        userName.innerText = user.displayName || "User";
        loadMembers(user.uid);
      } else {
        userSection.classList.add("hidden");
        loginBtn.classList.remove("hidden");
        appContent.classList.add("hidden");
        loggedOutView.classList.remove("hidden");
        allMembers = [];
      }
    });

    toggleFormBtn.onclick = () => {
      if (memberForm.classList.contains("hidden")) {
        memberForm.classList.remove("hidden");
        toggleFormText.innerText = "ফরম বন্ধ করুন";
      } else {
        resetForm();
      }
    };

    function showToast(msg) {
      toastMsg.innerText = msg;
      toast.classList.remove("translate-y-24", "opacity-0");
      setTimeout(() => toast.classList.add("translate-y-24", "opacity-0"), 2200);
    }

    memberForm.onsubmit = async (e) => {
      e.preventDefault();
      if (!currentUser) return;

      const editingId = editMemberId.value;
      const memberData = {
        uid: currentUser.uid,
        name: memberName.value.trim(),
        role: memberRole.value,
        phone: memberPhone.value.trim(),
        blood: memberBlood.value,
        address: memberAddress.value.trim(),
        updatedAt: Date.now()
      };

      try {
        if (editingId) {
          await updateDoc(doc(db, "ekota_club_members", editingId), memberData);
          showToast("তথ্য আপডেট হয়েছে!");
        } else {
          memberData.createdAt = Date.now();
          await addDoc(collection(db, "ekota_club_members"), memberData);
          showToast("নতুন সদস্য যুক্ত হয়েছে!");
        }
        resetForm();
      } catch (err) {
        alert("ত্রুটি: " + err.message);
      }
    };

    cancelEditBtn.onclick = resetForm;

    function resetForm() {
      editMemberId.value = "";
      memberForm.reset();
      formTitle.innerText = "সদস্যের তথ্য ফরম";
      submitBtnText.innerText = "সংরক্ষণ করুন";
      memberForm.classList.add("hidden");
      toggleFormText.innerText = "নতুন সদস্য যোগ";
    }

    function loadMembers(uid) {
      const q = query(collection(db, "ekota_club_members"), where("uid", "==", uid));
      onSnapshot(q, (snapshot) => {
        allMembers = [];
        snapshot.forEach((docSnap) => {
          allMembers.push({ id: docSnap.id, ...docSnap.data() });
        });
        renderMembers();
      }, (err) => {
        console.error(err);
        membersList.innerHTML = "<p class='text-rose-500 text-center text-sm py-4'>ডাটাবেজ লোড হচ্ছে না</p>";
      });
    }

    searchInput.oninput = () => renderMembers();
    roleFilter.onchange = () => renderMembers();

    function renderMembers() {
      const qText = searchInput.value.toLowerCase();
      const filter = roleFilter.value;

      statTotalMembers.innerText = `${allMembers.length} জন`;

      let filtered = allMembers.filter(m => {
        const matchesSearch = 
          (m.name || "").toLowerCase().includes(qText) ||
          (m.phone || "").includes(qText) ||
          (m.role || "").toLowerCase().includes(qText) ||
          (m.address || "").toLowerCase().includes(qText);

        if (!matchesSearch) return false;
        if (filter !== "all" && m.role !== filter) return false;
        return true;
      });

      filtered.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
      membersList.innerHTML = "";

      if (filtered.length === 0) {
        membersList.innerHTML = `
          <div class="text-center py-10 text-slate-400">
            <i class="fa-solid fa-users-slash text-3xl mb-2 opacity-50"></i>
            <p class="text-xs">কোনো সদস্য পাওয়া যায়নি</p>
          </div>
        `;
        return;
      }

      filtered.forEach((member) => {
        const cleanPhone = (member.phone || "").replace(/[^0-9]/g, '');
        const card = document.createElement("div");
        card.className = "light-glass-card p-4 rounded-3xl flex flex-col gap-2.5 transition";

        card.innerHTML = `
          <div class="flex justify-between items-start gap-2">
            <div>
              <div class="flex items-center gap-2">
                <h3 class="text-sm font-bold text-slate-800">${member.name}</h3>
                <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800 border border-emerald-200">${member.role}</span>
              </div>
              <p class="text-xs font-semibold text-slate-600 mt-1 flex items-center gap-2">
                <i class="fa-solid fa-phone text-emerald-600 text-[11px]"></i> ${member.phone}
                ${member.blood ? `<span class="bg-rose-100 text-rose-700 px-1.5 py-0.2 text-[10px] rounded font-bold border border-rose-200">🩸 ${member.blood}</span>` : ''}
              </p>
              ${member.address ? `
                <p class="text-[11px] text-slate-500 mt-0.5 flex items-center gap-1.5">
                  <i class="fa-solid fa-location-dot text-slate-400"></i> ${member.address}
                </p>
              ` : ''}
            </div>

            <!-- Quick Action Call & WhatsApp -->
            <div class="flex items-center gap-1.5">
              <a href="tel:${cleanPhone}" class="w-8 h-8 rounded-full bg-emerald-50 hover:bg-emerald-100 text-emerald-600 flex items-center justify-center border border-emerald-200 text-xs shadow-sm transition" title="কল করুন">
                <i class="fa-solid fa-phone"></i>
              </a>
              <a href="https://wa.me/88${cleanPhone}" target="_blank" class="w-8 h-8 rounded-full bg-green-50 hover:bg-green-100 text-green-600 flex items-center justify-center border border-green-200 text-sm shadow-sm transition" title="হোয়াটসঅ্যাপে মেসেজ দিন">
                <i class="fa-brands fa-whatsapp"></i>
              </a>
            </div>
          </div>

          <div class="flex justify-end items-center gap-2 pt-2 border-t border-slate-100 text-[11px]">
            <button onclick="window.startEdit('${member.id}')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1 rounded-xl transition text-xs font-semibold shadow-sm">
              <i class="fa-regular fa-pen-to-square"></i> এডিট
            </button>
            <button onclick="window.deleteMember('${member.id}')" class="bg-rose-50 hover:bg-rose-100 text-rose-600 px-2.5 py-1 rounded-xl transition text-xs shadow-sm">
              <i class="fa-regular fa-trash-can"></i>
            </button>
          </div>
        `;
        membersList.appendChild(card);
      });
    }

    window.startEdit = (id) => {
      const m = allMembers.find(mem => mem.id === id);
      if (!m) return;
      editMemberId.value = m.id;
      memberName.value = m.name || "";
      memberRole.value = m.role || "সাধারণ সদস্য";
      memberPhone.value = m.phone || "";
      memberBlood.value = m.blood || "";
      memberAddress.value = m.address || "";
      
      formTitle.innerText = "সদস্যের তথ্য এডিট করুন";
      submitBtnText.innerText = "আপডেট করুন";
      memberForm.classList.remove("hidden");
      toggleFormText.innerText = "ফরম বন্ধ করুন";
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.deleteMember = async (id) => {
      if (confirm("আপনি কি নিশ্চিত এই সদস্যের তথ্য মুছে ফেলতে চান?")) {
        await deleteDoc(doc(db, "ekota_club_members", id));
        showToast("সদস্য মুছে ফেলা হয়েছে!");

    };
